name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TOR_BUNDLE_VERSION: "16.0.1"
  TOR_BUNDLE_SHA256: "7039cb16060ab22e669852e55774d894b55f25ea8bd0ab7194d3478429a58725"
  PYTHON_STEM_COMMIT: "7d420c20"

jobs:
  unit-tests:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install man, lsof and pandoc
        run: sudo apt-get update && sudo apt-get install -y man-db lsof pandoc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --verbose

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libevent-2.1-7 lsof

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Download and verify the Tor Expert Bundle
        run: |
          mkdir -p tor-bundle
          cd tor-bundle
          curl -fsSL -o tor-expert-bundle.tar.gz \
            "https://archive.torproject.org/tor-package-archive/torbrowser/${TOR_BUNDLE_VERSION}/tor-expert-bundle-linux-x86_64-${TOR_BUNDLE_VERSION}.tar.gz"
          echo "${TOR_BUNDLE_SHA256}  tor-expert-bundle.tar.gz" | sha256sum --check
          tar -xzf tor-expert-bundle.tar.gz
          chmod +x tor/tor

      - name: Run integration tests
        env:
          TOR_BINARY: ${{ github.workspace }}/tor-bundle/tor/tor
          LD_LIBRARY_PATH: ${{ github.workspace }}/tor-bundle/tor
        run: cargo test --features integration --verbose

  python-differential:
    name: Differential Tests Against Python Stem
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check out Python Stem
        run: |
          sudo apt-get update && sudo apt-get install -y python3-cryptography
          git clone https://gitlab.torproject.org/tpo/network-health/stem.git python-stem
          git -C python-stem checkout "${PYTHON_STEM_COMMIT}"

      - name: Verify the committed golden files are reproducible
        env:
          PYTHONPATH: ${{ github.workspace }}/python-stem
        run: |
          python3 tests/golden/generate.py > /tmp/descriptors.json
          python3 tests/golden/directories.py > /tmp/directories.json
          python3 tests/golden/helpers.py > /tmp/helpers.json
          python3 tests/golden/mutations.py > /tmp/mutations.json
          python3 tests/golden/events.py python-stem/test/unit/response/events.py > /tmp/events.json
          cmp /tmp/descriptors.json tests/golden/descriptors.json
          cmp /tmp/directories.json tests/golden/directories.json
          cmp /tmp/helpers.json tests/golden/helpers.json
          cmp /tmp/mutations.json tests/golden/mutations.json
          cmp /tmp/events.json tests/golden/events.json

      - name: Run live differential tests
        env:
          STEM_PYTHON_PATH: ${{ github.workspace }}/python-stem
        run: cargo test --release --test descriptor_network --test descriptor_generated
