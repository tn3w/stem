[package]
name = "stem"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "A complete Rust library for the Tor control protocol, descriptors and relay protocol, ported from Python stem"
license = "Apache-2.0"
authors = ["tn3w <tn3w@protonmail.com>"]
repository = "https://github.com/tn3w/stem"
homepage = "https://stem.tn3w.dev"
documentation = "https://stem.tn3w.dev/docs/"
readme = "README.md"
keywords = ["tor", "privacy", "onion", "control-protocol", "async"]
categories = ["network-programming", "asynchronous", "cryptography"]

[features]
integration = []

[dependencies]
aes = "0.9.2"
base64 = "0.23.1"
bzip2-rs = "0.1.2"
chrono = { version = "0.4.45", features = ["serde"] }
ctr = "0.10.1"
curve25519-dalek = "5.0.0"
data-encoding = "2.11.1"
ed25519-dalek = "3.0.0"
flate2 = "1.1.10"
hex = "0.4.3"
hmac = "0.13.0"
indexmap = { version = "2.14.2", features = ["serde"] }
log = "0.4.34"
lzma-rs = "0.3.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rpassword = "7.5.4"
rsa = "0.9.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustyline = "18.0.1"
ruzstd = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
sha3 = "0.12.0"
shake = "0.1.0"
subtle = "2.6.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.9"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
